services:
  db:
    image: imresamu/postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: armaia_nodi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_password_123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d armaia_nodi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - armaia_internal

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:dev_password_123@db:5432/armaia_nodi
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - armaia_internal

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      - armaia_internal

  proxy:
    image: nginx:alpine
    restart: always
    ports:
      - "8055:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - armaia_internal
      - armaia_public

networks:
  armaia_internal:
    internal: true
  armaia_public:

volumes:
  pgdata:
  uploads:
